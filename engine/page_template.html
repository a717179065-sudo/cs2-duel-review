<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* 布局：一栏到底的复盘单。顶部比分和回合条（每回合一格） → 整场总结 → 每回合一张卡（左侧裁切小地图，右侧时间线），卡片按回合顺序排 */
:root {
  --bg: #eceee9; --surface: #f8f9f6; --sunk: #e3e6e0; --ink: #171b18; --muted: #5b635d; --line: #d2d7cf;
  --t: #b8701a; --t-soft: #f3e3cc; --ct: #2d6cb5; --ct-soft: #dbe6f3;
  --win: #2c8655; --win-soft: #d8ecdf; --loss: #c8443a; --loss-soft: #f5dcd9;
  --land: #cfd4cb; --path-halo: #f8f9f6;
  --f-display: "Barlow Condensed", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111412; --surface: #191d1a; --sunk: #222723; --ink: #e7ebe6; --muted: #9aa39c; --line: #2c322e;
  --t: #e3a050; --t-soft: #3a2a15; --ct: #6aa3e6; --ct-soft: #182a40;
  --win: #4fb77e; --win-soft: #16301f; --loss: #ec6a5e; --loss-soft: #3a1b18;
  --land: #2f3631; --path-halo: #191d1a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111412; --surface: #191d1a; --sunk: #222723; --ink: #e7ebe6; --muted: #9aa39c; --line: #2c322e;
  --t: #e3a050; --t-soft: #3a2a15; --ct: #6aa3e6; --ct-soft: #182a40;
  --win: #4fb77e; --win-soft: #16301f; --loss: #ec6a5e; --loss-soft: #3a1b18;
  --land: #2f3631; --path-halo: #191d1a; color-scheme: dark }

[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 15px/1.65 var(--f-body); }
.wrap { max-width: 1000px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; text-wrap: balance }
p { margin: 0 }
a { color: inherit }
button { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--ct); outline-offset: 2px }
.muted { color: var(--muted) }
.eyebrow { font: 600 13px/1 var(--f-display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted) }
code, .mono { font-family: var(--f-mono); font-size: 12.5px }
.num { font-variant-numeric: tabular-nums }

/* 顶部 */
header { display: grid; gap: 14px }
.score { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px }
.score .big { font: 700 64px/1 var(--f-display); letter-spacing: .01em }
.score .big .sep { color: var(--muted); padding: 0 .12em }
.score .res { font: 700 22px/1 var(--f-display); color: var(--loss) }
.score .res.w { color: var(--win) }
.halves { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted) }
.halves b { font: 600 17px var(--f-display); color: var(--ink) }
.halves .ct { color: var(--ct) } .halves .t { color: var(--t) }
.me { overflow-x: auto }
.me table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 560px }
.me th, .me td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap }
.me th:first-child, .me td:first-child { text-align: left }
.me th { font-weight: 500; color: var(--muted); font-size: 12px }
.me tr.me td { font-weight: 700; background: var(--sunk) }
.me tr.grp td { color: var(--muted); font-size: 12px; padding-top: 10px; border-bottom: 0 }
.me div { display: grid }
.me span { font-size: 12px; color: var(--muted); letter-spacing: .04em }
.me b { font: 600 26px/1.1 var(--f-display) }

.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(34px, 1fr)); gap: 4px }
.strip a { display: grid; place-items: center; height: 44px; border-radius: 4px; text-decoration: none; position: relative;
  font: 600 16px var(--f-display); background: var(--loss-soft); color: var(--loss); border-top: 4px solid var(--t) }
.strip a.w { background: var(--win-soft); color: var(--win) }
.strip a.ct { border-top-color: var(--ct) }
.strip a i { position: absolute; bottom: 4px; width: 6px; height: 6px; border-radius: 50% }
.strip a i.bad { background: var(--loss) } .strip a i.minor { background: var(--t) } .strip a i.good { background: var(--win) } .strip a i.cost { background: var(--muted) }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 12px; color: var(--muted) }
.legend span { display: inline-flex; align-items: center; gap: 6px }
.legend i { width: 12px; height: 4px; display: inline-block; border-radius: 2px }

/* 整场总结 */
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 22px; display: grid; gap: 20px }
.summary > h2 { font-size: 23px }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px }
.cols > div { min-width: 0; display: grid; gap: 12px; align-content: start }
.blockhead { font: 600 15px var(--f-display); letter-spacing: .08em; color: var(--muted) }
.issue { display: grid; gap: 4px; padding-left: 12px; border-left: 3px solid var(--loss) }
.issue.good { border-left-color: var(--win) }
.issue h3 { font-size: 16px }
.issue p { font-size: 14px }
.issue .fix { font-size: 14px }
.issue .fix b { color: var(--loss) }
.rlinks { display: flex; flex-wrap: wrap; gap: 4px }
.rlinks a { font: 600 13px var(--f-display); text-decoration: none; padding: 1px 7px; border-radius: 4px; background: var(--sunk) }
.rlinks a:hover { background: var(--line) }
.tp { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; font-size: 14px }
.tp a { font: 600 15px var(--f-display); text-decoration: none; color: var(--ct) }
.watch { display: grid; gap: 8px }
.watch li { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 14px }
.watch ol { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px }
.board { overflow-x: auto }
.board table { border-collapse: collapse; width: 100%; font-size: 13px; min-width: 520px }
.board th, .board td { padding: 4px 8px; text-align: right; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap }
.board th:first-child, .board td:first-child { text-align: left }
.board th { font-weight: 500; color: var(--muted); font-size: 12px }
.board tr.me td { font-weight: 700 }
.board tr.grp td { color: var(--muted); font-size: 12px; padding-top: 10px; border-bottom: 0 }

/* 回合卡 */
.rounds { display: grid; gap: 18px }
.rcard { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px 20px; display: grid; gap: 14px; scroll-margin-top: 16px }
.rhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px }
.rhead .rn { font: 700 26px/1 var(--f-display) }
.side { font: 600 13px/1 var(--f-display); letter-spacing: .06em; padding: 4px 8px; border-radius: 4px; background: var(--t-soft); color: var(--t) }
.side.ct { background: var(--ct-soft); color: var(--ct) }
.out { font: 600 15px var(--f-display); color: var(--loss) } .out.w { color: var(--win) }
.rating { margin-left: auto; font-size: 12.5px; font-weight: 700; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted) }
.rating.good { border-color: var(--win); color: var(--win) } .rating.minor { border-color: var(--t); color: var(--t) } .rating.bad { background: var(--loss); border-color: var(--loss); color: #fff }
.buy { font-size: 13px; color: var(--muted) }
.rcard h3 { font-size: 19px }
.sit { font-size: 14px; color: var(--muted); max-width: 72ch }
.rbody { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start }
@media (max-width: 680px) { .rbody { grid-template-columns: minmax(0, 1fr) } .map { max-width: 360px } }
.map { display: grid; gap: 6px; min-width: 0 }
.map svg { width: 100%; height: auto; aspect-ratio: 1; background: var(--sunk); border-radius: 8px; display: block; max-width: 100% }
.mapkey { display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11.5px; color: var(--muted) }
.mapkey span { display: inline-flex; align-items: center; gap: 4px }
.story { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; min-width: 0 }
.story li { display: grid; grid-template-columns: 3.4em minmax(0, 1fr); gap: 10px; font-size: 14.5px }
.story .ts { font: 600 15px/1.55 var(--f-display); color: var(--muted); text-align: right; font-variant-numeric: tabular-nums }
.moments { display: grid; gap: 10px }
.mo { border-radius: 8px; padding: 12px 14px; background: var(--sunk); display: grid; gap: 6px; border-left: 4px solid var(--ink) }
.mo.bad { border-left-color: var(--loss) } .mo.good { border-left-color: var(--win) }
.mo .mh { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 12.5px; color: var(--muted) }
.mo .kind { font-weight: 700; color: var(--ink) }
.mo.bad .kind { color: var(--loss) } .mo.good .kind { color: var(--win) }
.mo .mt { font: 600 15px var(--f-display); color: var(--ink) }
.mo .what { font-weight: 500 }
.mo .better { font-size: 14.5px }
.mo .better b { font-weight: 700 }
.mo .ev { font-size: 13px; color: var(--muted) }
.mo .bl { margin-left: auto; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line) }
.mo .bl.self { border-color: var(--loss); color: var(--loss) }
.mo .bl.both { border-color: var(--loss); color: var(--loss); background: var(--loss-soft) }
.mo .bl.minor { border-color: var(--t); color: var(--t) }
.mo .bl.team { color: var(--muted) }
.mo .bl.cost { color: var(--muted); border-style: dashed }
.team { font-size: 14px; padding-top: 10px; border-top: 1px solid var(--line) }
.team b { font-weight: 700 }
.tags { display: flex; flex-wrap: wrap; gap: 6px }
.tags span { font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--sunk); color: var(--muted) }
.strip a.sum { grid-column: span 2; background: var(--sunk); color: var(--ink); border-top-color: var(--ink) }
.strip a[aria-current] { outline: 2px solid var(--ink); outline-offset: 1px }
.pager { display: flex; align-items: center; justify-content: space-between; gap: 10px }
.pager button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 6px 12px; font: 600 15px var(--f-display) }
.pager button:hover { border-color: var(--muted) }
.pager .pos { color: var(--muted); font: 500 14px var(--f-display) }
#rounds { display: grid; gap: 14px }
.cause { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px }
.cc { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: grid; gap: 4px; min-width: 0 }
.cc .lab { font-size: 12.5px; font-weight: 700; color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.cc .lab em { font-style: normal; font-weight: 600; font-size: 12px; padding: 0 8px; border-radius: 999px; background: var(--win-soft); color: var(--win) }
.cc p { font-size: 14.5px }
.cc.yp.good { border-color: var(--win) } .cc.yp.minor { border-color: var(--t) } .cc.yp.bad { border-color: var(--loss) }
.econ { border: 1px solid var(--line); border-radius: 8px; background: var(--bg) }
.econ > summary { cursor: pointer; padding: 8px 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: 14px }
.econ .lab { font: 600 13px var(--f-display); letter-spacing: .08em; color: var(--muted) }
.vd { margin-left: auto; font-size: 12px; font-weight: 700; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line) }
.vd.good { color: var(--win); border-color: var(--win) } .vd.minor { color: var(--t); border-color: var(--t) } .vd.bad { background: var(--loss); border-color: var(--loss); color: #fff }
.econ dl { margin: 0; padding: 0 12px 10px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 14px }
.econ dt { color: var(--muted); font-size: 13px; white-space: nowrap }
.econ dd { margin: 0 }
.chain { display: grid; gap: 8px }
.chain ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; border-left: 2px solid var(--line); padding-left: 14px }
.chain li { display: grid; grid-template-columns: 5.2em minmax(0, 1fr); gap: 10px; font-size: 14px; position: relative }
.chain li::before { content: ""; position: absolute; left: -19px; top: .55em; width: 8px; height: 8px; border-radius: 50%; background: var(--muted) }
.chain li a { font: 600 15px var(--f-display); text-decoration: none; color: var(--ct) }
.chain .lesson { font-size: 14.5px; background: var(--loss-soft); border-radius: 8px; padding: 8px 12px }
.owner { font-size: 12px; font-weight: 600; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); vertical-align: 2px }
.owner.me { border-color: var(--loss); color: var(--loss) }
.flow { display: grid; gap: 10px }
.flow > p { font-size: 15px; max-width: 72ch }
.flow ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px }
.flow li { display: grid; grid-template-columns: 5.4em minmax(0, 1fr); gap: 10px; padding: 8px 12px; border-radius: 8px; background: var(--loss-soft); border-left: 4px solid var(--loss) }
.flow li.good { background: var(--win-soft); border-left-color: var(--win) }
.flow li a { font: 600 15px var(--f-display); text-decoration: none; color: var(--loss) }
.flow li.good a { color: var(--win) }
.flow li div { display: grid; gap: 2px; font-size: 14px; min-width: 0 }
.flow li b { font-size: 15px }
.econ2 { display: grid; gap: 4px; padding: 8px 12px; border-radius: 8px; background: var(--bg); border: 1px solid var(--line); font-size: 14px }
.econ2 .lab { font: 600 13px var(--f-display); letter-spacing: .06em; color: var(--muted); margin-right: 10px }
.ideas { display: grid; gap: 4px; padding: 10px 14px; border-radius: 8px; border: 1px dashed var(--ct) }
.ideas .lab { font: 600 13px var(--f-display); letter-spacing: .06em; color: var(--ct) }
.ideas ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; font-size: 14.5px }
.mo .view { font-size: 13.5px; padding: 6px 10px; border-radius: 6px; background: var(--surface) }
.mo .view span { font: 600 12.5px var(--f-display); letter-spacing: .06em; color: var(--ct); margin-right: 8px }
.playbtn { justify-self: start; cursor: pointer; border: 1px solid var(--ct); color: var(--ct); background: var(--surface); border-radius: 6px; padding: 3px 12px; font: 600 14px var(--f-display) }
.playbtn:hover { background: var(--ct-soft) }
.clipbox { display: grid; gap: 8px }
.clipview { position: relative; max-width: 560px }
.clipview svg { width: 100%; height: auto; aspect-ratio: 1; background: var(--bg); border-radius: 8px; display: block; max-width: 100% }
.feed { position: absolute; top: 8px; right: 8px; margin: 0; padding: 0; list-style: none; display: grid; gap: 3px; font-size: 12px; max-width: 70% }
.feed li { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; text-align: right }
.feed b.ct { color: var(--ct) } .feed b.t { color: var(--t) }
.ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; max-width: 560px }
.ctl button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 6px; padding: 3px 10px; font: 600 14px var(--f-display) }
.ctl input[type=range] { flex: 1 1 160px; min-width: 0; accent-color: var(--ct);
  background: linear-gradient(90deg, transparent calc(var(--mark) - 1px), var(--loss) calc(var(--mark) - 1px), var(--loss) calc(var(--mark) + 1px), transparent calc(var(--mark) + 1px)) }
.ctl .tt { font: 600 14px var(--f-display); color: var(--muted); min-width: 5.5em }
.cliplegend { display: flex; flex-wrap: wrap; gap: 2px 12px; font-size: 11.5px; color: var(--muted) }
.cliplegend span { display: inline-flex; align-items: center; gap: 4px }
.cliplegend i { width: 9px; height: 9px; border-radius: 50%; display: inline-block }
.cliplegend i.me { background: var(--surface); border: 2px solid var(--ink) }
footer { font-size: 12.5px; color: var(--muted); display: grid; gap: 6px; max-width: 80ch }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs"></defs></svg>
<div class="wrap">
  <header>
    <span class="eyebrow" id="eyebrow"></span>
    <div class="score"><span class="big num" id="big"></span><span class="res" id="res"></span></div>
    <div class="halves" id="halves"></div>
    <div class="me" id="me"></div>
    <nav class="strip" id="strip" aria-label="回合"></nav>
    <div class="legend"><span><i style="background:var(--ct)"></i>上沿蓝 = 你是 CT</span><span><i style="background:var(--t)"></i>上沿橙 = 你是 T</span><span>底色绿 / 红 = 回合赢 / 输</span><span>小圆点是你这回合的表现：绿 打得好，橙 小问题，红 主要问题，没点 = 没问题</span><span>点格子切到那一回合，键盘 ← → 翻页</span></div>
  </header>

  <section class="summary" id="summary" aria-label="整场总结"></section>

  <section class="rounds" id="rounds" aria-label="逐回合复盘" hidden>
    <nav class="pager" id="pagerTop" aria-label="翻页"></nav>
    <div id="cards"></div>
    <nav class="pager" id="pagerBottom" aria-label="翻页"></nav>
  </section>

  <footer>
    <p>数据来自 demo 文件（demoparser2 解析）。</p>
    <p>时间是冻结时间结束后的秒数。tick 可以在 CS2 控制台输入 demo_gototick 加数字跳过去回看。地图是这几场所有玩家走过的位置画出来的轮廓，不是官方雷达图。</p>
  </footer>
</div>

<script>
const DATA = /*__DATA__*/null;
(function () {
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const M = DATA.meta, S = DATA.summary, U = DATA.user, R = DATA.rounds;
  const byRound = new Map(R.map(r => [r.round, r]));
  const sideCls = s => s === "CT" ? "ct" : "t";
  const RATE = { "打得好": "good", "正常": "", "有问题": "bad", "合理代价": "cost" };
  const YP = { "打得好": "good", "没问题": "good", "小问题": "minor", "主要问题": "bad" };
  const VD = { "买法对": "good", "可以商量": "minor", "买法不对": "bad" };
  const KIND = { "好": "good", "问题": "bad", "关键": "" };
  // 每条时刻的责任小标签：你的责任 / 你的责任 + 队友或团队 / 小问题 / 队友或团队 / 合理代价，各一个样式
  const BL = { "你的责任": "self", "你的责任 + 队友或团队": "both", "小问题": "minor", "队友或团队": "team", "合理代价": "cost" };
  const blTag = b => b && b !== "—" ? `<span class="bl ${BL[b] || ""}">${esc(b)}</span>` : "";
  const WPN = { ak47: "AK", m4a1: "M4A4", m4a1_silencer: "M4A1-S", awp: "AWP", galilar: "Galil", famas: "FAMAS", deagle: "沙鹰", usp_silencer: "USP",
    hkp2000: "P2000", glock: "格洛克", p250: "P250", tec9: "Tec-9", fiveseven: "FN57", cz75a: "CZ75", mp9: "MP9", mac10: "MAC-10", mp7: "MP7",
    ump45: "UMP", p90: "P90", ssg08: "鸟狙", sg556: "SG553", aug: "AUG", xm1014: "连喷", hegrenade: "雷", inferno: "火", knife: "刀" };
  const wpn = w => WPN[w] || String(w || "");
  const CLIPS = DATA.clips || {};
  const rl = n => `<a href="#r${n}" data-r="${n}">${n}</a>`;
  const tickBtn = t => `<code>${t}</code>`;

  // ---------- 顶部 ----------
  const [my, op] = M.score.split(":").map(Number);
  document.getElementById("eyebrow").textContent = `${M.match_no != null ? `第 ${M.match_no} 场 · ` : ""}${M.map.replace("de_", "").replace(/^./, c => c.toUpperCase())} · ${M.user}${M.match_no == null && M.demo ? ` · ${M.demo}` : ""}`;

    const box = b.nextElementSibling;
    box.hidden = !box.hidden;
    b.textContent = box.hidden ? "▶ 回放这一段" : "收起回放";
    if (!box.hidden && !box._clip) box._clip = makeClip(box, CLIPS[b.dataset.clip]);
    if (box.hidden && box._clip) box._clip.stop();
  });

  // ---------- 分页：0 = 整场总结，n = 第 n 回合 ----------
  const nums = R.map(r => r.round), sumEl = document.getElementById("summary"), roundsEl = document.getElementById("rounds");
  const pager = n => {
    const i = nums.indexOf(n), prev = nums[i - 1], next = nums[i + 1];
    return `<button type="button" data-go="${prev ?? 0}">${prev ? `← 第 ${prev} 回合` : "← 整场总结"}</button>
      <span class="pos num">${i + 1} / ${nums.length}</span>
      ${next ? `<button type="button" data-go="${next}">第 ${next} 回合 →</button>` : `<button type="button" data-go="0">回到整场总结</button>`}`;
  };
  let cur = -1;
  function show(n, scroll = true) {
    if (n !== 0 && !byRound.has(n)) n = 0;
    cur = n;
    sumEl.hidden = n !== 0;
    roundsEl.hidden = n === 0;
    document.querySelectorAll(".rcard").forEach(c => { c.hidden = c.id !== `r${n}`; });
    document.querySelectorAll("#strip a").forEach(a => a.toggleAttribute("aria-current", +a.dataset.r === n));
    if (n) document.getElementById("pagerTop").innerHTML = document.getElementById("pagerBottom").innerHTML = pager(n);
    try { history.replaceState(null, "", n ? `#r${n}` : "#summary"); } catch { }
    if (scroll) document.getElementById("strip").scrollIntoView({ block: "start" });
  }
  document.addEventListener("click", e => {
    const a = e.target.closest("[data-r], [data-go]");
    if (!a) return;
    e.preventDefault();
    show(+(a.dataset.r ?? a.dataset.go));
  });
  document.addEventListener("keydown", e => {
    if (e.target.closest("input, textarea") || e.altKey || e.ctrlKey || e.metaKey) return;
    const i = cur === 0 ? -1 : nums.indexOf(cur);
    if (e.key === "ArrowRight" && i < nums.length - 1) show(nums[i + 1]);
    if (e.key === "ArrowLeft" && cur !== 0) show(i > 0 ? nums[i - 1] : 0);
  });
  const h = location.hash.match(/^#r(\d+)$/);
  show(h ? +h[1] : 0, false);
  window.addEventListener("hashchange", () => { const m = location.hash.match(/^#r(\d+)$/); show(m ? +m[1] : 0); });
})();
</script>
